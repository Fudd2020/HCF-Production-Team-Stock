# 🚀 Deploy to FLY.IO — DORMANT. This fork deploys via Render.
#
# ⚠️ This workflow does NOT run automatically and must not be re-armed without
# a Fly account behind it.
#
# `render.yaml` owns deployment for HCF Production Stock: Render's `autoDeploy`
# rebuilds the live app on every push to `main`. This file is upstream Shelf's
# Fly.io pipeline, kept **deliberately** as the documented scale-up path
# (`render.yaml` line 28, `.claude/agents/shelf-release-manager.md`) alongside
# `apps/webapp/fly.toml` — neither is dead code, both are the migration route
# if the free Render plan is ever outgrown.
#
# It was firing on every push to `main` and failing at the registry login with
# "Username and password required", because `FLY_API_TOKEN` is an upstream
# secret this fork has never held. A permanently red check trains you to ignore
# the checks, which costs you the real failure — so the trigger is now
# `workflow_dispatch` only: the file stays readable and runnable on purpose,
# but nothing fires it by accident.
#
# ⚠️ **Re-arming this is not just uncommenting the trigger.** It would need
# `FLY_API_TOKEN` in repository secrets, a Fly app matching `fly.toml`'s name,
# and a decision about what happens to Render — two pipelines deploying the
# same branch is worse than either alone.
#
# When it moves, `test.yml` must lose the `push` trigger this change added to
# it, or `main` runs the suite twice.

name: 🚀 Deploy (Fly.io — dormant, manual only)

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yml
    secrets:
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      SUPABASE_ANON_PUBLIC: ${{ secrets.SUPABASE_ANON_PUBLIC }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SERVER_URL: ${{ secrets.SERVER_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

  build:
    name: 🐳 Build
    # only build/deploy main branch on pushes
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    steps:
      - name: 🛑 Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.11.0

      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 👀 Read app name
        uses: SebRollen/toml-action@v1.0.2
        id: app_name
        with:
          file: "apps/webapp/fly.toml"
          field: "app"

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Setup cache
      - name: ⚡️ Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: 🔑 Fly Registry Auth
        uses: docker/login-action@v2
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}

      - name: 🐳 Docker build
        uses: docker/build-push-action@v3
        with:
          context: .
          file: apps/webapp/Dockerfile
          push: true
          tags: registry.fly.io/${{ steps.app_name.outputs.value }}:${{ github.ref_name }}-${{ github.sha }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache-new

      # This ugly bit is necessary if you don't want your cache to grow forever
      # till it hits GitHub's limit of 5GB.
      # Temp fix
      # https://github.com/docker/build-push-action/issues/252
      # https://github.com/moby/buildkit/issues/1896
      - name: 🚚 Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [tests, build]
    # only build/deploy main branch on pushes
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

    steps:
      - name: 🛑 Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.11.0

      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 👀 Read app name
        uses: SebRollen/toml-action@v1.0.2
        id: app_name
        with:
          file: "apps/webapp/fly.toml"
          field: "app"

      - name: 🎈 Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@v1.4

      - name: 🚀 Deploy Staging
        if: ${{ github.ref == 'refs/heads/dev' }}
        run: flyctl deploy --remote-only --build-arg COMMIT_SHA=${{ github.sha }} --app ${{ steps.app_name.outputs.value }}-staging --dockerfile apps/webapp/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 🚀 Deploy Production
        if: ${{ github.ref == 'refs/heads/main' }}
        run: flyctl deploy --remote-only --build-arg COMMIT_SHA=${{ github.sha }} --app ${{ steps.app_name.outputs.value }} --dockerfile apps/webapp/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
